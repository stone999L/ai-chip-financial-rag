name: pipeline-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/download_reports.py"
      - "scripts/parse_reports.py"
      - "scripts/chunk_documents.py"
      - "data/reports_manifest.csv"
      - ".github/workflows/pipeline-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser dependencies
        run: python -m pip install pandas requests tqdm PyMuPDF pdfplumber
      - name: Validate manifest
        run: python scripts/validate_manifest.py
      - name: Download one verified report
        run: python scripts/download_reports.py --company 寒武纪
      - name: Parse first 20 pages
        run: python scripts/parse_reports.py --company 寒武纪 --max-pages 20
      - name: Chunk parsed pages
        run: python scripts/chunk_documents.py
      - name: Print smoke statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pages = Path("data/processed/pages.jsonl")
          chunks = Path("data/processed/chunks.jsonl")
          p = [json.loads(x) for x in pages.read_text(encoding="utf-8").splitlines() if x.strip()]
          c = [json.loads(x) for x in chunks.read_text(encoding="utf-8").splitlines() if x.strip()]
          print("pages=", len(p))
          print("chunks=", len(c))
          print("text_chunks=", sum(x["content_type"]=="text" for x in c))
          print("table_chunks=", sum(x["content_type"]=="table" for x in c))
          assert len(p) == 20
          assert len(c) > 0
          assert all(x.get("company_name") == "寒武纪" for x in c)
          assert all(x.get("page") for x in c)
          print("SMOKE_OK")
          PY
