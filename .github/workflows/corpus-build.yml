name: corpus-build

on:
  workflow_dispatch:
  push:
    paths:
      - "data/reports_manifest.csv"
      - "scripts/download_reports.py"
      - "scripts/parse_reports.py"
      - "scripts/chunk_documents.py"
      - ".github/workflows/corpus-build.yml"

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser dependencies
        run: python -m pip install pandas requests tqdm PyMuPDF pdfplumber
      - name: Validate source manifest
        run: python scripts/validate_manifest.py
      - name: Download all 10 reports
        run: python scripts/download_reports.py
      - name: Parse all reports
        run: python scripts/parse_reports.py
      - name: Chunk documents and tables
        run: python scripts/chunk_documents.py
      - name: Corpus statistics
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          pages_path = Path("data/processed/pages.jsonl")
          chunks_path = Path("data/processed/chunks.jsonl")
          pages = [json.loads(x) for x in pages_path.read_text(encoding="utf-8").splitlines() if x.strip()]
          chunks = [json.loads(x) for x in chunks_path.read_text(encoding="utf-8").splitlines() if x.strip()]
          companies = Counter(x["company_name"] for x in chunks)
          types = Counter(x["content_type"] for x in chunks)
          print("TOTAL_PAGES", len(pages))
          print("TOTAL_CHUNKS", len(chunks))
          print("CHUNK_TYPES", dict(types))
          print("COMPANY_CHUNKS")
          for k, v in companies.items():
              print(k, v)
          assert len(set(x["company_name"] for x in pages)) == 10
          assert len(pages) > 1500
          assert len(chunks) > 1000
          assert types["table"] > 0
          print("CORPUS_BUILD_OK")
          PY
      - name: Upload processed corpus
        uses: actions/upload-artifact@v4
        with:
          name: processed-corpus
          path: |
            data/processed/pages.jsonl
            data/processed/chunks.jsonl
          retention-days: 7
\n# retrieval refresh: bge-small\n