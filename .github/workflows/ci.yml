name: ci

on:
  push:
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight check dependencies
        run: python -m pip install pandas requests
      - name: Compile Python files
        run: python -m compileall app evaluation scripts src
      - name: Validate report manifest
        run: python scripts/validate_manifest.py
      - name: Validate evaluation questions
        run: python -c "import json; q=json.load(open('evaluation/questions.json',encoding='utf-8')); assert len(q)==10; assert sum(x['type']=='cross_company_global' for x in q)>=2"

      - name: Discover pending CNINFO report URLs
        continue-on-error: true
        run: python scripts/discover_cninfo.py
