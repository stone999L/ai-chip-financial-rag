<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f7f9fc"/>
  <rect x="55" y="45" width="1090" height="810" rx="18" fill="white" stroke="#dfe5ee"/>
  <text x="90" y="105" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#17233d">国产算力与智能芯片财报问答知识库</text>
  <text x="90" y="148" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#667085">真实检索结果快照 · Q9 · 跨公司全景题</text>
  <rect x="90" y="180" width="1020" height="115" rx="12" fill="#f1f5fb"/>
  <text x="115" y="216" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475467">问题</text>
  <text x="115" y="251" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#101828">10 家公司形成了哪些主要技术路线？按云端算力、CPU/GPU、端侧 SoC、</text>
  <text x="115" y="281" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="600" fill="#101828">IP/定制与 FPGA 等方向归纳，并指出代表公司。</text>
  <text x="90" y="342" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#101828">公司覆盖率</text>
  <rect x="90" y="367" width="310" height="112" rx="12" fill="#fff4e5"/><text x="115" y="406" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#8a5b19">BM25</text><text x="115" y="456" font-family="Arial" font-size="38" font-weight="700" fill="#b26a00">40%</text>
  <rect x="445" y="367" width="310" height="112" rx="12" fill="#fff4e5"/><text x="470" y="406" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#8a5b19">向量检索</text><text x="470" y="456" font-family="Arial" font-size="38" font-weight="700" fill="#b26a00">70%</text>
  <rect x="800" y="367" width="310" height="112" rx="12" fill="#fff4e5"/><text x="825" y="406" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#8a5b19">RRF 混合</text><text x="825" y="456" font-family="Arial" font-size="38" font-weight="700" fill="#b26a00">60%</text>
  <rect x="90" y="515" width="1020" height="72" rx="12" fill="#fff0f0"/><text x="115" y="560" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#b42318">人工复核：证据不足 ✕</text>
  <text x="90" y="640" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#101828">混合 Top-8 覆盖公司</text>
  <text x="105" y="685" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#344054">国科微、景嘉微、芯原股份、全志科技、寒武纪、复旦微电（6/10）</text>
  <text x="90" y="735" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#101828">缺失公司</text>
  <text x="105" y="778" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#b42318">海光信息、龙芯中科、瑞芯微、北京君正</text>
  <line x1="90" y1="812" x2="1110" y2="812" stroke="#e4e7ec"/>
  <text x="90" y="840" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#98a2b3">结论：固定 Top-K 相关性高不等于全景覆盖完整；需按公司拆分检索并检查覆盖率。</text>
</svg>